<svg xmlns="http://www.w3.org/2000/svg" width="880" height="584" viewBox="0 0 880 584" role="img" aria-label="git commit (run by a coding agent)">
<title>git commit (run by a coding agent)</title>
<rect width="880" height="584" rx="10" fill="#0d1117"/>
<rect width="880" height="30" rx="10" fill="#161b22"/>
<rect y="20" width="880" height="10" fill="#161b22"/>
<circle cx="18" cy="15" r="5.5" fill="#ff5f57"/><circle cx="36" cy="15" r="5.5" fill="#febc2e"/><circle cx="54" cy="15" r="5.5" fill="#28c840"/>
<text x="440" y="19" fill="#8b949e" font-size="12" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">git commit (run by a coding agent)</text>
<g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="14">
<text y="78" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="58.8" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">buzzcut</tspan><tspan x="95.6" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="104.0" textLength="462.0" lengthAdjust="spacing" fill="#8b949e">· commit message · 1 file, +8 −1 · 42 words (budget 37)</tspan></text>
<rect x="196.40000000000003" y="104" width="25.200000000000003" height="19" rx="3" fill="#e3b341"/>
<text y="118" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="75.6" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">YAP SCORE</tspan><tspan x="112.4" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="129.2" textLength="50.4" lengthAdjust="spacing" fill="#e3b341" font-weight="700">40/100</tspan><tspan x="179.6" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="196.4" textLength="25.2" lengthAdjust="spacing" fill="#0d1117" font-weight="700"> C </tspan><tspan x="221.6" textLength="151.2" lengthAdjust="spacing" fill="#e6edf3">  Starting to yap.</tspan></text>
<text y="158" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="53.6" textLength="168.0" lengthAdjust="spacing" fill="#e3b341">markdown-in-commit  </tspan><tspan x="221.6" textLength="428.4" lengthAdjust="spacing" fill="#e6edf3">Markdown headers or bold labels in a commit message</tspan><tspan x="650.0" textLength="33.6" lengthAdjust="spacing" fill="#8b949e">  L3</tspan></text>
<text y="178" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="613.2" lengthAdjust="spacing" fill="#8b949e">→ git log shows raw text, so "## Summary" and **bold** show up as literal</tspan></text>
<text y="198" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="243.6" lengthAdjust="spacing" fill="#8b949e">symbols. Use plain sentences.</tspan></text>
<text y="218" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="53.6" textLength="168.0" lengthAdjust="spacing" fill="#e3b341">ticked-boxes        </tspan><tspan x="221.6" textLength="193.2" lengthAdjust="spacing" fill="#e6edf3">2 pre-ticked checkboxes</tspan><tspan x="414.8" textLength="42.0" lengthAdjust="spacing" fill="#8b949e">  L12</tspan></text>
<text y="238" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="621.6" lengthAdjust="spacing" fill="#8b949e">→ Replace the checklist with what you actually ran and what happened, e.g.</tspan></text>
<text y="258" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="201.6" lengthAdjust="spacing" fill="#8b949e">`npm test` (212 passed).</tspan></text>
<text y="278" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="53.6" textLength="168.0" lengthAdjust="spacing" fill="#e3b341">vague-verification  </tspan><tspan x="221.6" textLength="277.2" lengthAdjust="spacing" fill="#e6edf3">"Tested locally", but tested how?</tspan><tspan x="498.8" textLength="42.0" lengthAdjust="spacing" fill="#8b949e">  L12</tspan></text>
<text y="298" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="546.0" lengthAdjust="spacing" fill="#8b949e">→ Name the command or steps you ran and the result, e.g. `go test</tspan></text>
<text y="318" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="436.8" lengthAdjust="spacing" fill="#8b949e">./billing/...` passes, or the manual steps you took.</tspan></text>
<text y="338" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="53.6" textLength="168.0" lengthAdjust="spacing" fill="#e3b341">ai-opener           </tspan><tspan x="221.6" textLength="302.4" lengthAdjust="spacing" fill="#e6edf3">Opens with "This commit introduces…"</tspan><tspan x="524.0" textLength="33.6" lengthAdjust="spacing" fill="#8b949e">  L4</tspan></text>
<text y="358" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="554.4" lengthAdjust="spacing" fill="#8b949e">→ Start with the change itself: "Retry webhook sends on 5xx so …".</tspan></text>
<text y="378" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="53.6" textLength="168.0" lengthAdjust="spacing" fill="#e3b341">ai-vocab            </tspan><tspan x="221.6" textLength="336.0" lengthAdjust="spacing" fill="#e6edf3">AI vocabulary: "comprehensive", "robust"</tspan><tspan x="557.6" textLength="33.6" lengthAdjust="spacing" fill="#8b949e">  L1</tspan></text>
<text y="398" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="596.4" lengthAdjust="spacing" fill="#8b949e">→ Use the plain word ("use", not "leverage"), or say the specific thing</tspan></text>
<text y="418" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="67.2" lengthAdjust="spacing" fill="#8b949e">instead.</tspan></text>
<text y="438" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e6edf3"> </tspan><tspan x="53.6" textLength="168.0" lengthAdjust="spacing" fill="#e3b341">bullet-bloat        </tspan><tspan x="221.6" textLength="344.4" lengthAdjust="spacing" fill="#e6edf3">3 bullet points for a 9-line diff (max 2)</tspan><tspan x="566.0" textLength="33.6" lengthAdjust="spacing" fill="#8b949e">  L7</tspan></text>
<text y="458" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="621.6" lengthAdjust="spacing" fill="#8b949e">→ Keep the bullets for the parts of the change a reviewer would ask about;</tspan></text>
<text y="478" xml:space="preserve"><tspan x="20.0" textLength="201.6" lengthAdjust="spacing" fill="#e6edf3">                        </tspan><tspan x="221.6" textLength="428.4" lengthAdjust="spacing" fill="#8b949e">git log reads the rest better as a sentence or two.</tspan></text>
<text y="518" xml:space="preserve"><tspan x="20.0" textLength="117.6" lengthAdjust="spacing" fill="#e6edf3">  6 warnings  </tspan><tspan x="137.6" textLength="8.4" lengthAdjust="spacing" fill="#8b949e">·</tspan><tspan x="146.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="162.8" textLength="117.6" lengthAdjust="spacing" fill="#ff7b72">fails (max 35)</tspan></text>
<text y="558" xml:space="preserve"><tspan x="20.0" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="36.8" textLength="117.6" lengthAdjust="spacing" fill="#ff7b72">Commit blocked</tspan><tspan x="154.4" textLength="520.8" lengthAdjust="spacing" fill="#e6edf3"> (Claude Code detected). Rewrite the message and commit again.</tspan></text>
