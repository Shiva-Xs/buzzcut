<text y="298" xml:space="preserve"><tspan x="20.0" textLength="495.6" lengthAdjust="spacing" fill="#e6edf3">   117 words for a 9-line diff (13 words per changed line).</tspan></text>
<text y="318" xml:space="preserve"><tspan x="20.0" textLength="394.8" lengthAdjust="spacing" fill="#e6edf3">   Could have been ~84 words. 28% of it is yap.</tspan></text>
<text y="358" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="75.6" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">THE ROAST</tspan></text>
<text y="378" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#ff7b72">✗</tspan><tspan x="53.6" textLength="378.0" lengthAdjust="spacing" fill="#e6edf3"> Filled out the whole form for a 9-line diff.</tspan></text>
<text y="398" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="53.6" textLength="495.6" lengthAdjust="spacing" fill="#e6edf3"> comprehensive, robust, enhancing. The LinkedIn post writes</tspan></text>
<text y="418" xml:space="preserve"><tspan x="20.0" textLength="100.8" lengthAdjust="spacing" fill="#e6edf3">     itself.</tspan></text>
<text y="438" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="53.6" textLength="453.6" lengthAdjust="spacing" fill="#e6edf3"> Claims "enhancing the reliability". Source: trust me.</tspan></text>
<text y="458" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="53.6" textLength="504.0" lengthAdjust="spacing" fill="#e6edf3"> 5 emoji-led headers. This is a diff, not a launch party. 🚀</tspan></text>
<text y="478" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="8.4" lengthAdjust="spacing" fill="#e3b341">!</tspan><tspan x="53.6" textLength="445.2" lengthAdjust="spacing" fill="#e6edf3"> 4 bold phrases. When everything is bold, nothing is.</tspan></text>
<text y="498" xml:space="preserve"><tspan x="20.0" textLength="142.8" lengthAdjust="spacing" fill="#8b949e">     … and 6 more</tspan></text>
<text y="538" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="109.2" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">WORTH KEEPING</tspan><tspan x="154.4" textLength="16.8" lengthAdjust="spacing" fill="#e6edf3">  </tspan><tspan x="171.2" textLength="378.0" lengthAdjust="spacing" fill="#8b949e">nothing: no numbers, no errors, no reason why</tspan></text>
<text y="578" xml:space="preserve"><tspan x="20.0" textLength="25.2" lengthAdjust="spacing" fill="#e6edf3">   </tspan><tspan x="45.2" textLength="58.8" lengthAdjust="spacing" fill="#e6edf3" font-weight="700">VERDICT</tspan><tspan x="104.0" textLength="361.2" lengthAdjust="spacing" fill="#e6edf3">  Longer than the diff, and it isn't close.</tspan></text>
